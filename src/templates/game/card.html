<!-- The button label describes the card state without revealing a hidden motif. -->
<button class="memory-card" type="button" data-id="{{id}}" aria-label="Hidden card {{number}}">
  <span class="memory-card__inner">
    <span class="memory-card__face memory-card__face--back">
      <img src="{{root}}icons/logo_developer-akademie.png" alt="">
    </span>
    <span class="memory-card__face memory-card__face--front">
      <img src="{{face}}" alt="">
    </span>
  </span>
</button>
