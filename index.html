<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#303131">
  <title>Memory – Ready to play?</title>
  <link rel="icon" type="image/svg+xml" href="/icons/controller.svg">
  <script type="module" src="/src/ts/main.ts"></script>
</head>
<body>
  <main class="home">
    <div class="home__container">
      <img class="home__decoration" src="/icons/controller.svg" alt="" aria-hidden="true">
      <section class="home__intro" aria-labelledby="home-title">
        <div class="home__headline">
          <p class="home__eyebrow">It’s play time.</p>
          <h1 class="home__title" id="home-title">Ready to play?</h1>
        </div>
        <button class="play-button" type="button" aria-label="Play Memory">
          <img class="play-button__controller" src="/icons/controller.svg" alt="" aria-hidden="true">
          <span class="play-button__label">Play</span>
          <span class="play-button__arrow" aria-hidden="true"></span>
        </button>
      </section>
    </div>
  </main>
</body>
</html>
